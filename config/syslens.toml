# Loaded by default, relative to the working directory. CLI options override this file.
# Message publication period; collectors use the independent periods below.
interval_ms = 100
# samples = 60 # Number of publication rounds. Omit for continuous collection.
proc_root = "/proc"

[sampling]
# All periods are milliseconds. Changes take effect after restarting syslens.
# System total CPU and per-core CPU come from the same /proc/stat observation.
system_cpu_ms = 100
system_memory_ms = 200
process_cpu_ms = 100
process_memory_ms = 200
thread_cpu_ms = 100
# Also controls the persistent tegrastats --interval when that source is used.
gpu_utilization_ms = 100
# System and process GPU memory share one driver snapshot.
gpu_memory_ms = 500
# nvidia-smi pmon supports periods of at least 1000 ms.
process_gpu_utilization_ms = 1000
# Exclude inputs older than their period multiplied by this value.
stale_after_periods = 3

[processes]
enabled = true
threads = true
# Empty selectors mean all visible processes. Names match /proc/PID/stat comm exactly.
# PID and name selectors are combined with OR.
pids = []
names = []

[gpu]
# Probe each GPU capability once at startup; unavailable sources stay disabled for this run.
enabled = true
sys_root = "/sys"
# NVIDIA Jetson: automatically find the GPU load sysfs node, otherwise use tegrastats.
# load_path = "/sys/devices/gpu.0/load"
tegrastats = "tegrastats"
# Orin: default is <sys_root>/kernel/debug/nvmap/iovmm/clients (requires read permission).
# nvmap_clients_path = "/sys/kernel/debug/nvmap/iovmm/clients"
# Thor: use GPU index 0 via nvidia-smi when nvmap is unavailable; Orin stubs are rejected.
nvidia_smi = "nvidia-smi"
# Timeout per tegrastats observation / nvidia-smi command.
timeout_ms = 1500

[recording]
enabled = true
directory = "recordings"
queue_capacity = 128
rotate_seconds = 300
# Uncompressed message payload budget, not exact file size. Rotation is between messages.
rotate_payload_bytes = 67108864
flush_ms = 1000

[foxglove]
enabled = true
bind = "127.0.0.1"
port = 8765
queue_capacity = 128

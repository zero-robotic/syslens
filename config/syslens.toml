# Loaded by default, relative to the working directory. CLI options override this file.
# Live delivery interval per topic. MCAP preserves every assembled observation.
interval_ms = 100
# samples = 60 # Run for 60 * interval_ms milliseconds, then drain. Omit to run continuously.
proc_root = "/proc"

[runtime]
# Bounded FIFO before assembly. Full queues pause the producer, never overwrite observations.
observation_queue_capacity = 1024
# A producer unable to enqueue within this limit is disabled with an explicit error.
enqueue_timeout_ms = 1000
collection_timeout_ms = 5000
# Total shutdown budget; half is reserved for output drain/finalization.
shutdown_timeout_ms = 5000
startup_timeout_ms = 15000

[sampling]
# All periods are milliseconds. Changes take effect after restarting syslens.
# System total CPU and per-core CPU come from the same /proc/stat observation.
system_cpu_ms = 100
system_memory_ms = 200
process_cpu_ms = 100
# Includes RSS, virtual memory and the current command line from /proc/PID/cmdline.
process_memory_ms = 200
thread_cpu_ms = 100
# Also controls the persistent tegrastats --interval when that source is used.
gpu_utilization_ms = 100
# System and process GPU memory share one driver snapshot.
gpu_memory_ms = 500
# nvidia-smi pmon supports periods of at least 1000 ms.
process_gpu_utilization_ms = 1000
# Expire retained inputs after this many periods; always preserve the triggering observation.
stale_after_periods = 3

[processes]
enabled = true
threads = true
# Empty selectors mean all visible processes. Names match /proc/PID/stat comm exactly.
# PID and name selectors are combined with OR.
pids = []
names = []

[gpu]
# Probe each GPU capability once at startup; unavailable sources stay disabled for this run.
enabled = true
sys_root = "/sys"
# NVIDIA Jetson: automatically find the GPU load sysfs node, otherwise use tegrastats.
# load_path = "/sys/devices/gpu.0/load"
tegrastats = "tegrastats"
# Orin: default is <sys_root>/kernel/debug/nvmap/iovmm/clients (requires read permission).
# nvmap_clients_path = "/sys/kernel/debug/nvmap/iovmm/clients"
# Thor: use GPU index 0 via nvidia-smi when nvmap is unavailable; Orin stubs are rejected.
nvidia_smi = "nvidia-smi"
# Timeout per tegrastats observation / nvidia-smi command.
timeout_ms = 1500

[recording]
enabled = true
directory = "recordings"
queue_capacity = 128
# disable / drop_newest / drop_oldest. Disable stops recording on overload and drains accepted data.
overflow = "disable"
# isolate keeps other outputs running; stop terminates the run on output failure.
on_failure = "isolate"
operation_timeout_ms = 5000
rotate_seconds = 300
# Uncompressed message payload budget, not exact file size. Rotation is between messages.
rotate_payload_bytes = 67108864
flush_ms = 1000

[foxglove]
enabled = true
bind = "127.0.0.1"
port = 8765
queue_capacity = 128
# Latest values are coalesced per topic before sending at interval_ms.
overflow = "drop_oldest"
on_failure = "isolate"
operation_timeout_ms = 5000

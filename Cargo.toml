[package]
name = "syslens"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Layered Linux process and system telemetry for Foxglove"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
foxglove = { version = "0.28", default-features = false, features = ["websocket"] }
libc = "0.2"
mcap = "0.25"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tungstenite = "0.28"

[profile.release]
lto = "thin"
strip = true
